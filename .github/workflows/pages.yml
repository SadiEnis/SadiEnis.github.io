name: Publish portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: node --test tests/localization.test.cjs
      - run: npm run build
      - name: Verify exported routes and assets
        run: |
          test -f out/index.html
          test -f out/motivation/index.html
          test -f out/contact/index.html
          test -f out/cv/index.html
          test -f out/cv/sadi-enis-guculer-cv.pdf
          test -d out/_next
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
